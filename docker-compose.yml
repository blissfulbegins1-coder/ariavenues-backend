version: "3.9"

services:
  backend:
    image: auditorium-backend:prod
    container_name: auditorium-backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped